name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose
      - name: leak grep (internal hosts, personal repos, live keys)
        run: sh scripts/precheck.sh --grep-only

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: cli
      - run: node bin/justclaw-it.js --help
        working-directory: cli
      - name: package contents
        working-directory: cli
        run: npm pack --dry-run 2>&1 | tee /dev/stderr | grep -q 'skills/justclaw-it-search/SKILL.md'
      - run: sh -n install.sh
      - name: examples/ and server.json are valid and in sync
        run: node scripts/check-examples.mjs
